<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; --night: #121214; --panel: #161618; --line: #2a2a2e; --text: #ededed; --muted: #a1a1aa; --ember: #ff6b35; --glow: #ffb347; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: var(--night); color: var(--text);
         font: 15px/1.5 Inter, "Segoe UI", system-ui, sans-serif;
         padding: max(env(safe-area-inset-top, 0px), 16px) 16px max(env(safe-area-inset-bottom, 0px), 16px); }
  html.android-app body { padding-top: max(env(safe-area-inset-top, 0px), 40px); padding-bottom: max(env(safe-area-inset-bottom, 0px), 56px); }
  .card { margin: auto; width: min(380px, 100%); text-align: center; }
  img { width: 76px; height: 76px; margin: 0 auto; display: block; }
  h1 { margin: 16px 0 6px; font-size: 20px; font-weight: 700; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .spinner { width: 26px; height: 26px; margin: 4px auto 0; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ember); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button { height: 42px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--ember); color: #160b06; font: inherit; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
</style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <img src="icon.svg" alt="">
    <div id="connecting">
      <h1>Connecting to Outhouse…</h1>
      <p id="where"></p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
    <div id="offline" class="hidden">
      <h1>Can't reach Outhouse</h1>
      <p>Check your internet connection. We'll keep trying, or you can give it a nudge.</p>
      <button type="button" id="retry">Try again</button>
    </div>
  </div>
<script>
  // The apps always open the one Outhouse server (DEFAULT_SERVER in
  // src-tauri/src/lib.rs). This page just checks it can be reached first, so
  // you get a friendly message instead of a browser error when you're offline.
  if (window.__OUTHOUSE_PLATFORM__ === "android") document.documentElement.classList.add("android-app");
  const $ = (id) => document.getElementById(id);
  let timer = 0;

  async function serverUrl() {
    if (window.__OUTHOUSE_SERVER__) return window.__OUTHOUSE_SERVER__;
    return window.__TAURI__.core.invoke("get_server");
  }

  async function reachable(server) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 8000);
    try {
      // no-cors: we only care that the server answers at all.
      await fetch(`${server}/api/health`, { mode: "no-cors", cache: "no-store", signal: ctl.signal });
      return true;
    } catch {
      return false;
    } finally {
      clearTimeout(t);
    }
  }

  async function connect() {
    clearTimeout(timer);
    $("offline").classList.add("hidden");
    $("connecting").classList.remove("hidden");
    const server = await serverUrl();
    $("where").textContent = server.replace(/^https?:\/\//, "");
    if (await reachable(server)) return location.replace(`${server}/`);
    $("connecting").classList.add("hidden");
    $("offline").classList.remove("hidden");
    timer = setTimeout(connect, 15000);
  }

  $("retry").addEventListener("click", connect);
  addEventListener("online", connect);
  connect();
</script>
</body>
</html>
