name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (build, tests, smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outhouse
          POSTGRES_PASSWORD: outhouse
          POSTGRES_DB: outhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outhouse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cargo build -p outhouse-server
      - name: Unit tests
        run: cargo test --workspace
      - name: Clippy (advice only)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
      - name: Website and example bot syntax check
        run: |
          node --check web/app.js
          node --check web/features.js
          node --check web/chat-extras.js
          node --check web/sw.js
          node --check web/bots/dice-bot.mjs
      - name: Smoke test (real server + Postgres)
        env:
          DATABASE_URL: postgres://outhouse:outhouse@localhost:5432/outhouse
          BIND_ADDR: 127.0.0.1:8080
          WEB_DIR: web
          UPLOAD_DIR: /tmp/outhouse-uploads
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret-secret-secret-secret-secret
          RUST_LOG: outhouse_server=info
        run: bash ci/smoke.sh
      - name: UI test (headless Chrome, screenshots)
        env:
          DATABASE_URL: postgres://outhouse:outhouse@localhost:5432/outhouse
          BIND_ADDR: 127.0.0.1:8080
          WEB_DIR: web
          UPLOAD_DIR: /tmp/outhouse-uploads
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret-secret-secret-secret-secret
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          ./target/debug/outhouse-server > /tmp/ui-server.log 2>&1 &
          python ci/ui_test.py
      - name: Screenshots (base64, for review)
        if: always()
        run: |
          for f in /tmp/ui-shots/*.png; do
            [ -f "$f" ] || continue
            echo "=====SHOT $(basename "$f")"
            base64 -w0 "$f"; echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: /tmp/ui-shots/
          if-no-files-found: ignore
      - name: Server log
        if: always()
        run: |
          cat /tmp/outhouse-server.log 2>/dev/null || true
          cat /tmp/ui-server.log 2>/dev/null || true

  desktop:
    name: Desktop app (Windows installer)
    runs-on: windows-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set the version (and updater files when the signing key is set)
        shell: bash
        env:
          PUBKEY: ${{ secrets.OUTHOUSE_UPDATER_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f));
            c.version = process.env.VERSION;
            if (process.env.HAS_SIGNING_KEY === "yes") c.bundle.createUpdaterArtifacts = true;
            if (process.env.PUBKEY) c.plugins.updater.pubkey = process.env.PUBKEY.trim();
            fs.writeFileSync(f, JSON.stringify(c, null, 2));'
          [ "$HAS_SIGNING_KEY" = yes ] || echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set, so this build can't auto-update."
      - name: Build installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OUTHOUSE_UPDATER_PUBKEY: ${{ secrets.OUTHOUSE_UPDATER_PUBKEY }}
        run: npx --yes @tauri-apps/cli@^2 build
      - uses: actions/upload-artifact@v4
        with:
          name: Outhouse-Windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          fi
          echo "Using NDK at $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Set the version
        run: |
          node -e '
            const fs = require("fs"), f = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f));
            c.version = process.env.VERSION;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));'
      - name: Generate the Android project
        working-directory: desktop/src-tauri
        run: |
          npm install --no-audit --no-fund
          npm run tauri -- android init --ci
      - name: Allow microphone and notifications
        run: |
          MANIFEST=desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          grep -n "permission" "$MANIFEST"
      - name: Build APK
        working-directory: desktop/src-tauri
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Release build signed with the Outhouse key, so new versions install over old ones.
            npm run tauri -- android build --apk --target aarch64
            APK=$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > /tmp/outhouse.jks
            "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
            "$BT/apksigner" sign --ks /tmp/outhouse.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --ks-key-alias outhouse --out "$GITHUB_WORKSPACE/Outhouse-Android.apk" /tmp/aligned.apk
            rm -f /tmp/outhouse.jks
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 isn't set, so this is a debug build that can't update in place."
            npm run tauri -- android build --apk --debug --target aarch64
            cp "$(find gen/android/app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/Outhouse-Android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Outhouse-Android-APK
          path: Outhouse-Android.apk
          if-no-files-found: error

  release:
    name: Publish downloads (Releases → "latest")
    needs: [server, desktop, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect files and update manifests
        run: |
          mkdir out
          cp dl/Outhouse-Android-APK/Outhouse-Android.apk out/
          cp "$(find dl/Outhouse-Windows-installer -name '*.exe' | head -1)" out/Outhouse-Windows-Setup.exe
          SIG=$(find dl/Outhouse-Windows-installer -name '*.exe.sig' | head -1)
          # __BASE__ is swapped for https://<your server>/updates by deploy/fetch-updates.py.
          python3 - "$SIG" <<'PY'
          import json, sys, datetime, os
          version = os.environ["VERSION"]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          json.dump({"version": version, "url": "__BASE__/Outhouse-Android.apk", "pub_date": now},
                    open("out/android.json", "w"), indent=2)
          sig = sys.argv[1]
          if sig:
              json.dump({
                  "version": version,
                  "notes": "Outhouse " + version,
                  "pub_date": now,
                  "platforms": {"windows-x86_64": {
                      "signature": open(sig).read().strip(),
                      "url": "__BASE__/Outhouse-Windows-Setup.exe",
                  }},
              }, open("out/latest.json", "w"), indent=2)
          PY
          ls -la out
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/* --target "$GITHUB_SHA" --title "Outhouse $VERSION" \
            --notes "Built from $(echo $GITHUB_SHA | cut -c1-7). Your Outhouse server picks this up within 10 minutes and the apps update from there. To install by hand: Outhouse-Android.apk on Android, Outhouse-Windows-Setup.exe on Windows."
