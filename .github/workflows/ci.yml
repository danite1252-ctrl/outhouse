name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  # Nightly security scans (cargo audit + ZAP) instead of on every push.
  schedule:
    - cron: "30 16 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Outhouse server the Windows and Android apps open (see desktop/README.md).
  OUTHOUSE_SERVER_URL: https://oh.hartspace.cc

# Where jobs run (repository variables, Settings -> Secrets and variables -> Actions -> Variables;
# see deploy/ci-runner/README.md). Each value is JSON: a label string or a list of labels.
#   RUNNER_LINUX        e.g. ["self-hosted","linux","outhouse"]  (unset: ubuntu-latest)
#   RUNNER_WINDOWS      e.g. ["self-hosted","windows","outhouse"] (unset: windows-latest)
#   RUNNER_LINUX_LIGHT  the tiny jobs (What changed, Publish); unset: same as RUNNER_LINUX
#   SELF_HOSTED_ONLY    "true": anything unset above means the owner's runners
#                       (self-hosted + linux/windows + outhouse), never GitHub-hosted;
#                       jobs then wait for a runner instead of using paid minutes.
# With nothing set, everything runs on GitHub's runners exactly as before.
jobs:
  # Which parts changed, so the expensive jobs only run when they matter
  # (saves GitHub Actions minutes on a private repo).
  changes:
    name: What changed
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_LIGHT || vars.RUNNER_LINUX || (vars.SELF_HOSTED_ONLY == 'true' && '["self-hosted","linux","outhouse"]') || '"ubuntu-latest"') }}
    outputs:
      apps: ${{ steps.f.outputs.apps }}
      server: ${{ steps.f.outputs.server }}
      deps: ${{ steps.f.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ]; then
            echo "apps=$([ "$EVENT" = workflow_dispatch ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"; echo "deps=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FROM="${BASE:-$BEFORE}"
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            # New branch or unknown base: compare with main.
            FROM=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          fi
          if [ -z "$FROM" ] || [ "$FROM" = "$(git rev-parse HEAD)" ]; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$FROM" HEAD)
          fi
          echo "$CHANGED" | sed 's/^/changed: /' | head -50
          has() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }
          echo "apps=$(has '^(desktop/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "server=$(has '^(crates/|web/|ci/|Cargo\.|Dockerfile|deploy/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "deps=$(has '(Cargo\.lock|Cargo\.toml|web/vendor/|package(-lock)?\.json)')" >> "$GITHUB_OUTPUT"

  server:
    name: Server (build, tests, smoke test)
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (vars.SELF_HOSTED_ONLY == 'true' && '["self-hosted","linux","outhouse"]') || '"ubuntu-latest"') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outhouse
          POSTGRES_PASSWORD: outhouse
          POSTGRES_DB: outhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outhouse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Clear leftovers from earlier runs (self-hosted runners)
        run: bash ci/runner-cleanup.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cargo build -p outhouse-server
      - name: Unit tests
        run: cargo test --workspace
      - name: Desktop app update-state tests (plain Rust, no Tauri needed)
        run: |
          rustc --edition 2021 --test desktop/src-tauri/src/update_state.rs -o /tmp/update_state_tests
          /tmp/update_state_tests
      - name: Clippy (advice only)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
      - name: Website and example bot syntax check
        run: |
          node --check web/app.js
          node --check web/features.js
          node --check web/chat-extras.js
          node --check web/dms.js
          node --check web/threads.js
          node --check web/raids.js
          node --check web/wow.js
          node --check web/voice-extras.js
          node --check web/notify.js
          node --check web/thread-unread.js
          node --check web/components.js
          node --check web/automod.js
          node --check web/admin-extras.js
          node --check web/raid-admin.js
          node --check web/loot.js
          node --check web/channel-settings.js
          node --check web/nicknames.js
          node --check web/invites.js
          node --check web/invite-page.js
          node --check web/sw.js
          node --check web/landing.js
          node --check web/entry.js
          node --check web/updates.js
          node --check web/bots/dice-bot.mjs
      - name: Deploy scripts check (bash -n + shellcheck)
        run: |
          command -v shellcheck >/dev/null || sudo -n apt-get install -y -qq shellcheck >/dev/null \
            || { echo "::error::shellcheck isn't installed (deploy/ci-runner/setup-linux-runner.sh installs it)"; exit 1; }
          for f in deploy/*.sh deploy/ci-runner/*.sh ci/smoke.sh ci/runner-cleanup.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/backup.sh deploy/healthcheck.sh deploy/setup.sh deploy/restore.sh deploy/security-scan.sh ci/zap.sh \
            ci/runner-cleanup.sh deploy/ci-runner/*.sh
      - name: Workflow check (actionlint)
        run: |
          V=1.7.7
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz" | tar xz -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=
      - name: Python for the tests (a venv; self-hosted Ubuntu won't pip-install into the system Python)
        run: |
          if python3 -m venv "$RUNNER_TEMP/venv"; then
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::python3 -m venv failed; using the system Python"
          fi
      - name: Smoke test (real server + Postgres)
        env:
          DATABASE_URL: postgres://outhouse:outhouse@localhost:5432/outhouse
          BIND_ADDR: 127.0.0.1:8080
          WEB_DIR: web
          UPLOAD_DIR: /tmp/outhouse-uploads
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret-secret-secret-secret-secret
          RUST_LOG: outhouse_server=info
        run: bash ci/smoke.sh
      - name: UI test (headless Chrome, screenshots)
        env:
          DATABASE_URL: postgres://outhouse:outhouse@localhost:5432/outhouse
          BIND_ADDR: 127.0.0.1:8080
          WEB_DIR: web
          UPLOAD_DIR: /tmp/outhouse-uploads
          # A real LiveKit (dev mode: key "devkey", secret "secret") for the voice tests.
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
          LIVEKIT_API_URL: http://127.0.0.1:7880
          # Wowhead and Battle.net stand-ins (ci/wow_mock.py).
          WOWHEAD_URL: http://127.0.0.1:8099
          WOWHEAD_TOOLTIP_URL: http://127.0.0.1:8099
          WOWHEAD_ICON_URL: http://127.0.0.1:8099/icons
          WOWHEAD_MIN_GAP_MS: "100"
          LINK_PREVIEWS_OFFLINE: "1"
          # Carol is the site owner here (smoke-test users came first).
          SITE_OWNER: carolui
          BNET_CLIENT_ID: mock-id
          BNET_CLIENT_SECRET: mock-secret
          BNET_OAUTH_URL: http://127.0.0.1:8099/oauth
          BNET_API_URL: http://127.0.0.1:8099/api
        run: |
          docker rm -f livekit >/dev/null 2>&1 || true
          docker run -d --name livekit --network host livekit/livekit-server:latest \
            --dev --bind 127.0.0.1 --node-ip 127.0.0.1 > /dev/null
          pip install --quiet playwright
          # GitHub's runners: install Chrome's system libraries too (apt, needs sudo). Self-hosted:
          # deploy/ci-runner/setup-linux-runner.sh installed them once (marker file), so just the browser.
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ] || { [ ! -f /etc/outhouse-ci-runner ] && sudo -n true 2>/dev/null; }; then
            python -m playwright install --with-deps chromium >/dev/null
          else
            python -m playwright install chromium >/dev/null
            # If the runner's Chrome libraries are missing (setup script not finished, or a newer
            # Chrome needs more), install them with the runner's apt-only sudo.
            SHELLBIN=$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell 2>/dev/null | sort -V | tail -1)
            if [ -n "$SHELLBIN" ] && ldd "$SHELLBIN" | grep -q "not found"; then
              ldd "$SHELLBIN" | grep "not found" || true
              PKGS=$(python -m playwright install-deps --dry-run chromium 2>/dev/null | grep -oE 'apt-get install -y --no-install-recommends .*' | sed 's/.*--no-install-recommends//' | tr -d '"')
              if [ -n "$PKGS" ]; then sudo -n apt-get update -qq && sudo -n apt-get install -y --no-install-recommends $PKGS >/dev/null; fi
              if ldd "$SHELLBIN" | grep -q "not found"; then
                echo "::error::Chrome's libraries are missing on this runner. Re-run deploy/ci-runner/setup-linux-runner.sh on it."; exit 1
              fi
            fi
          fi
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7880 >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:7880 >/dev/null || { docker logs livekit; exit 1; }
          python3 ci/wow_mock.py 8099 > /tmp/wow-mock-ui.log 2>&1 &
          ./target/debug/outhouse-server > /tmp/ui-server.log 2>&1 &
          python ci/landing_test.py
          python ci/invite_test.py
          python ci/ui_test.py
          python ci/csp_test.py
      - name: Screenshots (base64, for review)
        if: always()
        run: |
          for f in /tmp/ui-shots/*.png; do
            [ -f "$f" ] || continue
            echo "=====SHOT $(basename "$f")"
            base64 -w0 "$f"; echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: /tmp/ui-shots/
          if-no-files-found: ignore
      - name: Server log
        if: always()
        run: |
          cat /tmp/outhouse-server.log 2>/dev/null || true
          cat /tmp/ui-server.log 2>/dev/null || true
          docker logs livekit 2>&1 | tail -80 || true
      - name: Clean up (containers, background processes, temp files)
        if: always()
        run: if [ -f ci/runner-cleanup.sh ]; then bash ci/runner-cleanup.sh --end; else docker rm -f livekit 2>/dev/null || true; fi

  desktop:
    name: Desktop app (Windows installer)
    needs: changes
    # Only when the app itself (desktop/) or this workflow changed; the apps
    # load the web client from the server, so web changes don't need them.
    if: needs.changes.outputs.apps == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_WINDOWS || (vars.SELF_HOSTED_ONLY == 'true' && '["self-hosted","windows","outhouse"]') || '"windows-latest"') }}
    env:
      VERSION: 0.2.${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'yes' || 'no' }}
    steps:
      # With WSL installed, "bash" on PATH can be WSL's (C:\Windows\System32\bash.exe),
      # which would run the bash steps inside Linux. Put Git's bash first.
      - name: Use Git's bash
        shell: powershell
        run: |
          $git = "C:\Program Files\Git\bin"
          if (Test-Path "$git\bash.exe") { Add-Content -Path $env:GITHUB_PATH -Value $git }
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PowerShell scripts parse (deploy/*.ps1)
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in @(Get-ChildItem deploy/*.ps1) + @(Get-ChildItem deploy/ci-runner/*.ps1)) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad = $true; $errs | ForEach-Object { Write-Host "::error file=$($f.Name)::$($_.Message) (line $($_.Extent.StartLineNumber))" } }
          }
          if ($bad) { exit 1 }
      - name: Set the version (and updater files when the signing key is set)
        shell: bash
        env:
          PUBKEY: ${{ secrets.OUTHOUSE_UPDATER_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f));
            c.version = process.env.VERSION;
            if (process.env.HAS_SIGNING_KEY === "yes") c.bundle.createUpdaterArtifacts = true;
            if (process.env.PUBKEY) c.plugins.updater.pubkey = process.env.PUBKEY.trim();
            fs.writeFileSync(f, JSON.stringify(c, null, 2));'
          [ "$HAS_SIGNING_KEY" = yes ] || echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set, so this build can't auto-update."
      - name: Build installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OUTHOUSE_UPDATER_PUBKEY: ${{ secrets.OUTHOUSE_UPDATER_PUBKEY }}
        shell: bash
        # Downloads (NSIS tools from GitHub) sometimes 504; try up to 3 times.
        run: |
          for i in 1 2 3; do
            npx --yes @tauri-apps/cli@^2 build && exit 0
            echo "::warning::Build attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
      - name: Check invite links (outhouse:// deep links) are in the build
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          grep -q 'name = "tauri-plugin-deep-link"' Cargo.lock || { echo "::error::tauri-plugin-deep-link isn't in the Windows build"; exit 1; }
          NSI=$(find target/release/nsis -name 'installer.nsi' | head -1)
          echo "NSIS script: $NSI"
          grep -n 'Software\\Classes\\outhouse' "$NSI" || true
          grep -q 'Software\\Classes\\outhouse" "URL Protocol"' "$NSI" || { echo "::error::The installer doesn't register outhouse:// links"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Outhouse-Windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  android:
    name: Android app (APK)
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (vars.SELF_HOSTED_ONLY == 'true' && '["self-hosted","linux","outhouse"]') || '"ubuntu-latest"') }}
    env:
      VERSION: 0.2.${{ github.run_number }}
      # Only installed when the runner has no Android SDK / NDK (self-hosted); GitHub's
      # image already has them. Keep in step with deploy/ci-runner/setup-linux-runner.sh.
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
    steps:
      - uses: actions/checkout@v4
      - name: Clear leftovers from earlier runs (self-hosted runners)
        run: bash ci/runner-cleanup.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Android SDK (GitHub's runners have one; a self-hosted runner gets it once and keeps it)
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; mkdir -p "$SDK"; fi
          echo "Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if ls "$SDK"/cmdline-tools/*/bin/sdkmanager >/dev/null 2>&1; then
            echo "tools=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No Android command-line tools in $SDK yet; installing them."
            echo "tools=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: android-actions/setup-android@v3
        if: steps.sdk.outputs.tools == 'no'
        with:
          packages: platform-tools
      - name: Android SDK pieces (NDK, build tools, platform tools) when missing
        run: |
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          NEED=()
          [ -d "$ANDROID_HOME/platform-tools" ] || NEED+=("platform-tools")
          ls -d "$ANDROID_HOME"/build-tools/*/ >/dev/null 2>&1 || NEED+=("build-tools;$ANDROID_BUILD_TOOLS_VERSION")
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if { [ -z "$NDK" ] || [ ! -d "$NDK" ]; } && ! ls -d "$ANDROID_HOME"/ndk/*/ >/dev/null 2>&1; then
            NEED+=("ndk;$ANDROID_NDK_VERSION")
          fi
          if [ "${#NEED[@]}" = 0 ]; then echo "Android SDK has everything."; exit 0; fi
          [ -n "$SM" ] || { echo "::error::No sdkmanager in $ANDROID_HOME"; exit 1; }
          echo "Installing: ${NEED[*]}"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "${NEED[@]}" > /tmp/sdkmanager.log 2>&1 || { tail -40 /tmp/sdkmanager.log; exit 1; }
      - name: Find the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          fi
          echo "Using NDK at $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Set the version
        # Android only updates in place when versionCode goes up, so set it explicitly from the
        # run number (well above the 2xxx codes Tauri derived from 0.2.N in earlier builds).
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "ANDROID_VERSION_CODE=$((100000 + VERSION_CODE))" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs"), f = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f));
            c.version = process.env.VERSION;
            c.bundle.android = Object.assign({}, c.bundle.android, { versionCode: 100000 + Number(process.env.VERSION_CODE) });
            // Invite links (Android App Links) for the server this build opens.
            for (const m of c.plugins["deep-link"].mobile) m.host = new URL(process.env.OUTHOUSE_SERVER_URL).host;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));'
          grep -n -A3 '"android"' desktop/src-tauri/tauri.conf.json
          grep -n -A8 '"deep-link"' desktop/src-tauri/tauri.conf.json
      - name: Generate the Android project
        working-directory: desktop/src-tauri
        run: |
          npm install --no-audit --no-fund
          npm run tauri -- android init --ci
      - name: Android platform the generated project compiles against (installed when missing)
        working-directory: desktop/src-tauri/gen/android
        run: |
          API=$(grep -hoE 'compileSdk *(=|Version)? *[0-9]+' app/build.gradle.kts app/build.gradle 2>/dev/null | grep -oE '[0-9]+$' | head -1)
          echo "compileSdk: ${API:-unknown}"
          if [ -n "$API" ] && [ ! -d "$ANDROID_HOME/platforms/android-$API" ]; then
            SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            # Newer platforms are sometimes listed as e.g. "android-37.0" rather than "android-37".
            PKG=$("$SM" --list 2>/dev/null | grep -oE "platforms;android-$API(\.[0-9]+)?([-.][A-Za-z0-9]+)?" | sort -V | tail -1)
            echo "Installing ${PKG:-platforms;android-$API}"
            "$SM" "${PKG:-platforms;android-$API}" > /tmp/sdkmanager.log 2>&1 || { tail -40 /tmp/sdkmanager.log; exit 1; }
          fi
      - name: App icon (Outhouse logo, incl. adaptive and round icons)
        working-directory: desktop/src-tauri
        run: |
          # `tauri icon` writes the Android mipmaps into gen/android when it exists.
          npm run tauri -- icon icons/icon.png
          RES=gen/android/app/src/main/res
          # Adaptive icon background: the logo's own dark tile colour instead of white.
          FILES=$(grep -rl "ic_launcher_background" "$RES/values" 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            mkdir -p "$RES/values"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#1C1C1F</color>\n</resources>\n' > "$RES/values/ic_launcher_background.xml"
            FILES="$RES/values/ic_launcher_background.xml"
          fi
          for f in $FILES; do
            sed -i 's|<color name="ic_launcher_background">[^<]*</color>|<color name="ic_launcher_background">#1C1C1F</color>|' "$f"
            echo "$f:"; cat "$f"
          done
          find "$RES" -path '*mipmap*' -type f | sort
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml" 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" checkout -- desktop/src-tauri/icons 2>/dev/null || true
      - name: Allow microphone and notifications
        run: |
          MANIFEST=desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          grep -n "permission" "$MANIFEST"
      - name: Fetch Gradle (with retries; services.gradle.org can be slow)
        working-directory: desktop/src-tauri/gen/android
        run: |
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4 5; do
            ./gradlew --version >/dev/null && exit 0
            echo "::warning::Gradle download attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
      - name: Build APK
        working-directory: desktop/src-tauri
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Build tools: $BT"
          # The signing key only ever lives in the runner's per-job temp folder, and goes even if a step fails.
          KS="$RUNNER_TEMP/outhouse.jks"
          trap 'rm -f "$KS" "$RUNNER_TEMP/aligned.apk"' EXIT
          if [ -n "$KEYSTORE_B64" ]; then
            # Release build signed with the Outhouse key, so new versions install over old ones.
            # 64-bit and 32-bit ARM so older/cheaper phones can install it too.
            # Downloads (Gradle, Maven, GitHub releases) sometimes 504; try up to 3 times.
            for i in 1 2 3; do
              npm run tauri -- android build --apk --target aarch64 armv7 && break
              [ "$i" = 3 ] && exit 1
              echo "::warning::APK build attempt $i failed; retrying in 60s"; sleep 60
            done
            find gen/android/app/build/outputs/apk -name '*.apk' -print
            APK=$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
            (umask 077; echo "$KEYSTORE_B64" | base64 -d > "$KS")
            # Align first (16 KB pages for native libs where zipalign supports it), then sign (v1+v2+v3).
            "$BT/zipalign" -f -P 16 4 "$APK" "$RUNNER_TEMP/aligned.apk" 2>/dev/null || "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --ks-key-alias outhouse --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$GITHUB_WORKSPACE/Outhouse-Android.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$KS"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 isn't set, so this is a debug build that can't update in place."
            npm run tauri -- android build --apk --debug --target aarch64 armv7
            cp "$(find gen/android/app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/Outhouse-Android.apk"
          fi
      - name: Check invite links open the app (Android App Links intent filter)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          MANIFEST=desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          HOST=$(node -e 'console.log(new URL(process.env.OUTHOUSE_SERVER_URL).host)')
          sed -n '/<intent-filter/,/<\/intent-filter>/p' "$MANIFEST"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml Outhouse-Android.apk > /tmp/apk-manifest.txt
          grep -n -A14 'intent-filter' /tmp/apk-manifest.txt | grep -E 'autoVerify|scheme|host|pathPrefix|action|category|launchMode' || true
          grep -q 'autoVerify' /tmp/apk-manifest.txt || { echo "::error::The APK has no autoVerify intent filter"; exit 1; }
          grep -q "\"$HOST\"" /tmp/apk-manifest.txt || { echo "::error::The APK doesn't handle links to $HOST"; exit 1; }
          grep -q '"/invite"' /tmp/apk-manifest.txt || { echo "::error::The APK doesn't handle /invite links"; exit 1; }
      - name: Check the APK (version code, signature, ABIs, icon)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=Outhouse-Android.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-icon|application:|native-code|launchable)" || true
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -v "^WARNING: META-INF" || true
          "$BT/zipalign" -c -P 16 -v 4 "$APK" 2>/dev/null | tail -1 || "$BT/zipalign" -c -p -v 4 "$APK" | tail -1
          unzip -l "$APK" | grep -E "lib/|res/mipmap" || true
          CODE=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "versionCode=$CODE (expected $ANDROID_VERSION_CODE)"
          [ "$CODE" = "$ANDROID_VERSION_CODE" ] || { echo "::error::versionCode $CODE isn't $ANDROID_VERSION_CODE"; exit 1; }
          SHA=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signing certificate SHA-256: $SHA"
          # The Outhouse release key (CN=Outhouse, O=Hartspace) used since build 15. A different key means
          # phones can't update in place, so shout about it.
          [ "$SHA" = "d6314591e5fa44c082282792c52831883bfe0cfd85632b518be504fe830f8ae3" ] \
            || echo "::warning::The APK isn't signed with the usual Outhouse key ($SHA). Phones with an older Outhouse will need to uninstall first."
      - uses: actions/upload-artifact@v4
        with:
          name: Outhouse-Android-APK
          path: Outhouse-Android.apk
          if-no-files-found: error
      - name: Clean up (signing key, temp files, background processes)
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/outhouse.jks" /tmp/outhouse.jks "$RUNNER_TEMP/aligned.apk" /tmp/aligned.apk
          # Gradle's daemon would otherwise stay running on a self-hosted runner.
          [ -x desktop/src-tauri/gen/android/gradlew ] && (cd desktop/src-tauri/gen/android && ./gradlew --stop >/dev/null 2>&1) || true
          [ -f ci/runner-cleanup.sh ] && bash ci/runner-cleanup.sh --end || true

  dast:
    name: DAST (OWASP ZAP against a test server)
    needs: changes
    # Nightly, by hand, or on main when server code changed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true')
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (vars.SELF_HOSTED_ONLY == 'true' && '["self-hosted","linux","outhouse"]') || '"ubuntu-latest"') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outhouse
          POSTGRES_PASSWORD: outhouse
          POSTGRES_DB: outhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outhouse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Clear leftovers from earlier runs (self-hosted runners)
        run: bash ci/runner-cleanup.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p outhouse-server
      - name: ZAP baseline + API scan (High alerts fail; see ci/zap-rules.tsv)
        env:
          DATABASE_URL: postgres://outhouse:outhouse@localhost:5432/outhouse
          BIND_ADDR: 127.0.0.1:8080
          WEB_DIR: web
          UPLOAD_DIR: /tmp/outhouse-uploads
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret-secret-secret-secret-secret
          LINK_PREVIEWS_OFFLINE: "1"
          RUST_LOG: outhouse_server=info
        run: |
          ./target/debug/outhouse-server > /tmp/dast-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && break; sleep 1; done
          bash ci/zap.sh
      - name: Server log
        if: always()
        run: tail -200 /tmp/dast-server.log 2>/dev/null || true
      - name: Clean up (ZAP containers, test server, temp files)
        if: always()
        run: if [ -f ci/runner-cleanup.sh ]; then bash ci/runner-cleanup.sh --end; fi

  security:
    name: Security (cargo audit, vendored scripts)
    needs: changes
    # Nightly, by hand, or when dependencies / vendored scripts change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.deps == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (vars.SELF_HOSTED_ONLY == 'true' && '["self-hosted","linux","outhouse"]') || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Clear leftovers from earlier runs (self-hosted runners)
        run: bash ci/runner-cleanup.sh
      # Preinstalled on GitHub's runners; makes sure cargo is there on a self-hosted one.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec advisories; fails on vulnerabilities, warnings are listed)
        run: |
          set -o pipefail
          # RUSTSEC-2023-0071 (rsa, Marvin attack): only reached through sqlx-mysql, which
          # sqlx's lock file lists but Outhouse never builds or uses (Postgres only).
          cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071 2>&1 | tee /tmp/audit-server.txt || AUDIT_FAIL=1
          echo "---- desktop app ----"
          cargo audit --file desktop/src-tauri/Cargo.lock 2>&1 | tee /tmp/audit-desktop.txt || echo "::warning::cargo audit found problems in the desktop app's dependencies (see above)"
          if [ -n "$AUDIT_FAIL" ]; then echo "::error::cargo audit found vulnerable server dependencies"; exit 1; fi
      - name: Vendored LiveKit client matches the npm release it says it is
        run: |
          V=$(cat web/vendor/livekit-client.version)
          echo "LiveKit client $V"
          (cd /tmp && npm pack "livekit-client@$V" --silent >/dev/null && tar xzf "livekit-client-$V.tgz")
          if ! cmp /tmp/package/dist/livekit-client.umd.js web/vendor/livekit-client.umd.js; then
            echo "::error::web/vendor/livekit-client.umd.js isn't dist/livekit-client.umd.js from livekit-client $V on npm"
            echo "=====LIVEKIT $V"; base64 -w0 /tmp/package/dist/livekit-client.umd.js; echo
            exit 1
          fi
          echo "web/vendor/livekit-client.umd.js is livekit-client $V, byte for byte"
      - name: Clean up temp files
        if: always()
        run: if [ -f ci/runner-cleanup.sh ]; then bash ci/runner-cleanup.sh --end; fi

  release:
    name: Publish downloads (Releases → "latest")
    needs: [server, desktop, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_LIGHT || vars.RUNNER_LINUX || (vars.SELF_HOSTED_ONLY == 'true' && '["self-hosted","linux","outhouse"]') || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      # A self-hosted runner keeps its work folder: start from an empty one.
      - name: Start clean
        run: rm -rf dl out
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect files and update manifests
        run: |
          mkdir out
          cp dl/Outhouse-Android-APK/Outhouse-Android.apk out/
          cp "$(find dl/Outhouse-Windows-installer -name '*.exe' | head -1)" out/Outhouse-Windows-Setup.exe
          SIG=$(find dl/Outhouse-Windows-installer -name '*.exe.sig' | head -1)
          # __BASE__ is swapped for https://<your server>/updates by deploy/fetch-updates.py.
          python3 - "$SIG" <<'PY'
          import json, sys, datetime, os
          version = os.environ["VERSION"]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          json.dump({"version": version, "url": "__BASE__/Outhouse-Android.apk", "pub_date": now},
                    open("out/android.json", "w"), indent=2)
          sig = sys.argv[1]
          if sig:
              json.dump({
                  "version": version,
                  "notes": "Outhouse " + version,
                  "pub_date": now,
                  "platforms": {"windows-x86_64": {
                      "signature": open(sig).read().strip(),
                      "url": "__BASE__/Outhouse-Windows-Setup.exe",
                  }},
              }, open("out/latest.json", "w"), indent=2)
          PY
          ls -la out
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/* --target "$GITHUB_SHA" --title "Outhouse $VERSION" \
            --notes "Built from $(echo $GITHUB_SHA | cut -c1-7). Your Outhouse server picks this up within 10 minutes and the apps update from there. To install by hand: Outhouse-Android.apk on Android, Outhouse-Windows-Setup.exe on Windows."
