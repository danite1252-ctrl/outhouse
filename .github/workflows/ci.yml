name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Outhouse server the Windows and Android apps open (see desktop/README.md).
  OUTHOUSE_SERVER_URL: https://oh.hartspace.cc

jobs:
  server:
    name: Server (build, tests, smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outhouse
          POSTGRES_PASSWORD: outhouse
          POSTGRES_DB: outhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outhouse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cargo build -p outhouse-server
      - name: Unit tests
        run: cargo test --workspace
      - name: Clippy (advice only)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
      - name: Website and example bot syntax check
        run: |
          node --check web/app.js
          node --check web/features.js
          node --check web/chat-extras.js
          node --check web/dms.js
          node --check web/threads.js
          node --check web/raids.js
          node --check web/wow.js
          node --check web/voice-extras.js
          node --check web/notify.js
          node --check web/admin-extras.js
          node --check web/raid-admin.js
          node --check web/channel-settings.js
          node --check web/invites.js
          node --check web/invite-page.js
          node --check web/sw.js
          node --check web/landing.js
          node --check web/entry.js
          node --check web/bots/dice-bot.mjs
      - name: Deploy scripts check (bash -n + shellcheck)
        run: |
          for f in deploy/*.sh ci/smoke.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/backup.sh deploy/healthcheck.sh deploy/setup.sh deploy/restore.sh
      - name: Smoke test (real server + Postgres)
        env:
          DATABASE_URL: postgres://outhouse:outhouse@localhost:5432/outhouse
          BIND_ADDR: 127.0.0.1:8080
          WEB_DIR: web
          UPLOAD_DIR: /tmp/outhouse-uploads
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret-secret-secret-secret-secret
          RUST_LOG: outhouse_server=info
        run: bash ci/smoke.sh
      - name: UI test (headless Chrome, screenshots)
        env:
          DATABASE_URL: postgres://outhouse:outhouse@localhost:5432/outhouse
          BIND_ADDR: 127.0.0.1:8080
          WEB_DIR: web
          UPLOAD_DIR: /tmp/outhouse-uploads
          # A real LiveKit (dev mode: key "devkey", secret "secret") for the voice tests.
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
          LIVEKIT_API_URL: http://127.0.0.1:7880
          # Wowhead and Battle.net stand-ins (ci/wow_mock.py).
          WOWHEAD_URL: http://127.0.0.1:8099
          WOWHEAD_TOOLTIP_URL: http://127.0.0.1:8099
          WOWHEAD_ICON_URL: http://127.0.0.1:8099/icons
          LINK_PREVIEWS_OFFLINE: "1"
          # Carol is the site owner here (smoke-test users came first).
          SITE_OWNER: carolui
          BNET_CLIENT_ID: mock-id
          BNET_CLIENT_SECRET: mock-secret
          BNET_OAUTH_URL: http://127.0.0.1:8099/oauth
          BNET_API_URL: http://127.0.0.1:8099/api
        run: |
          docker run -d --name livekit --network host livekit/livekit-server:latest \
            --dev --bind 127.0.0.1 --node-ip 127.0.0.1 > /dev/null
          pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7880 >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:7880 >/dev/null || { docker logs livekit; exit 1; }
          python3 ci/wow_mock.py 8099 > /tmp/wow-mock-ui.log 2>&1 &
          ./target/debug/outhouse-server > /tmp/ui-server.log 2>&1 &
          python ci/landing_test.py
          python ci/ui_test.py
          python ci/invite_test.py
      - name: Screenshots (base64, for review)
        if: always()
        run: |
          for f in /tmp/ui-shots/*.png; do
            [ -f "$f" ] || continue
            echo "=====SHOT $(basename "$f")"
            base64 -w0 "$f"; echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: /tmp/ui-shots/
          if-no-files-found: ignore
      - name: Server log
        if: always()
        run: |
          cat /tmp/outhouse-server.log 2>/dev/null || true
          cat /tmp/ui-server.log 2>/dev/null || true
          docker logs livekit 2>&1 | tail -80 || true

  desktop:
    name: Desktop app (Windows installer)
    runs-on: windows-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set the version (and updater files when the signing key is set)
        shell: bash
        env:
          PUBKEY: ${{ secrets.OUTHOUSE_UPDATER_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f));
            c.version = process.env.VERSION;
            if (process.env.HAS_SIGNING_KEY === "yes") c.bundle.createUpdaterArtifacts = true;
            if (process.env.PUBKEY) c.plugins.updater.pubkey = process.env.PUBKEY.trim();
            fs.writeFileSync(f, JSON.stringify(c, null, 2));'
          [ "$HAS_SIGNING_KEY" = yes ] || echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set, so this build can't auto-update."
      - name: Build installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OUTHOUSE_UPDATER_PUBKEY: ${{ secrets.OUTHOUSE_UPDATER_PUBKEY }}
        run: npx --yes @tauri-apps/cli@^2 build
      - name: Check invite links (outhouse:// deep links) are in the build
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          grep -q 'name = "tauri-plugin-deep-link"' Cargo.lock || { echo "::error::tauri-plugin-deep-link isn't in the Windows build"; exit 1; }
          NSI=$(find target/release/nsis -name 'installer.nsi' | head -1)
          echo "NSIS script: $NSI"
          grep -n -i 'URL Protocol\|outhouse' "$NSI" | grep -i -B2 -A2 'protocol' | head -20 || true
          grep -q 'Software\\Classes\\outhouse' "$NSI" || grep -qi 'deep_link\|URL Protocol' "$NSI" || { echo "::error::The installer doesn't register outhouse:// links"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Outhouse-Windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          fi
          echo "Using NDK at $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Set the version
        # Android only updates in place when versionCode goes up, so set it explicitly from the
        # run number (well above the 2xxx codes Tauri derived from 0.2.N in earlier builds).
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "ANDROID_VERSION_CODE=$((100000 + VERSION_CODE))" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs"), f = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f));
            c.version = process.env.VERSION;
            c.bundle.android = Object.assign({}, c.bundle.android, { versionCode: 100000 + Number(process.env.VERSION_CODE) });
            // Invite links (Android App Links) for the server this build opens.
            for (const m of c.plugins["deep-link"].mobile) m.host = new URL(process.env.OUTHOUSE_SERVER_URL).host;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));'
          grep -n -A3 '"android"' desktop/src-tauri/tauri.conf.json
          grep -n -A8 '"deep-link"' desktop/src-tauri/tauri.conf.json
      - name: Generate the Android project
        working-directory: desktop/src-tauri
        run: |
          npm install --no-audit --no-fund
          npm run tauri -- android init --ci
      - name: App icon (Outhouse logo, incl. adaptive and round icons)
        working-directory: desktop/src-tauri
        run: |
          # `tauri icon` writes the Android mipmaps into gen/android when it exists.
          npm run tauri -- icon icons/icon.png
          RES=gen/android/app/src/main/res
          # Adaptive icon background: the logo's own dark tile colour instead of white.
          FILES=$(grep -rl "ic_launcher_background" "$RES/values" 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            mkdir -p "$RES/values"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#1C1C1F</color>\n</resources>\n' > "$RES/values/ic_launcher_background.xml"
            FILES="$RES/values/ic_launcher_background.xml"
          fi
          for f in $FILES; do
            sed -i 's|<color name="ic_launcher_background">[^<]*</color>|<color name="ic_launcher_background">#1C1C1F</color>|' "$f"
            echo "$f:"; cat "$f"
          done
          find "$RES" -path '*mipmap*' -type f | sort
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml" 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" checkout -- desktop/src-tauri/icons 2>/dev/null || true
      - name: Allow microphone and notifications
        run: |
          MANIFEST=desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          grep -n "permission" "$MANIFEST"
      - name: Build APK
        working-directory: desktop/src-tauri
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Build tools: $BT"
          if [ -n "$KEYSTORE_B64" ]; then
            # Release build signed with the Outhouse key, so new versions install over old ones.
            # 64-bit and 32-bit ARM so older/cheaper phones can install it too.
            npm run tauri -- android build --apk --target aarch64 armv7
            find gen/android/app/build/outputs/apk -name '*.apk' -print
            APK=$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
            echo "$KEYSTORE_B64" | base64 -d > /tmp/outhouse.jks
            # Align first (16 KB pages for native libs where zipalign supports it), then sign (v1+v2+v3).
            "$BT/zipalign" -f -P 16 4 "$APK" /tmp/aligned.apk 2>/dev/null || "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
            "$BT/apksigner" sign --ks /tmp/outhouse.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --ks-key-alias outhouse --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$GITHUB_WORKSPACE/Outhouse-Android.apk" /tmp/aligned.apk
            rm -f /tmp/outhouse.jks
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 isn't set, so this is a debug build that can't update in place."
            npm run tauri -- android build --apk --debug --target aarch64 armv7
            cp "$(find gen/android/app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/Outhouse-Android.apk"
          fi
      - name: Check invite links open the app (Android App Links intent filter)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          MANIFEST=desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          HOST=$(node -e 'console.log(new URL(process.env.OUTHOUSE_SERVER_URL).host)')
          sed -n '/<intent-filter/,/<\/intent-filter>/p' "$MANIFEST"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml Outhouse-Android.apk > /tmp/apk-manifest.txt
          grep -n -A14 'intent-filter' /tmp/apk-manifest.txt | grep -E 'autoVerify|scheme|host|pathPrefix|action|category|launchMode' || true
          grep -q 'autoVerify' /tmp/apk-manifest.txt || { echo "::error::The APK has no autoVerify intent filter"; exit 1; }
          grep -q "\"$HOST\"" /tmp/apk-manifest.txt || { echo "::error::The APK doesn't handle links to $HOST"; exit 1; }
          grep -q '"/invite"' /tmp/apk-manifest.txt || { echo "::error::The APK doesn't handle /invite links"; exit 1; }
      - name: Check the APK (version code, signature, ABIs, icon)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=Outhouse-Android.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-icon|application:|native-code|launchable)" || true
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -v "^WARNING: META-INF" || true
          "$BT/zipalign" -c -P 16 -v 4 "$APK" 2>/dev/null | tail -1 || "$BT/zipalign" -c -p -v 4 "$APK" | tail -1
          unzip -l "$APK" | grep -E "lib/|res/mipmap" || true
          CODE=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "versionCode=$CODE (expected $ANDROID_VERSION_CODE)"
          [ "$CODE" = "$ANDROID_VERSION_CODE" ] || { echo "::error::versionCode $CODE isn't $ANDROID_VERSION_CODE"; exit 1; }
          SHA=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signing certificate SHA-256: $SHA"
          # The Outhouse release key (CN=Outhouse, O=Hartspace) used since build 15. A different key means
          # phones can't update in place, so shout about it.
          [ "$SHA" = "d6314591e5fa44c082282792c52831883bfe0cfd85632b518be504fe830f8ae3" ] \
            || echo "::warning::The APK isn't signed with the usual Outhouse key ($SHA). Phones with an older Outhouse will need to uninstall first."
      - uses: actions/upload-artifact@v4
        with:
          name: Outhouse-Android-APK
          path: Outhouse-Android.apk
          if-no-files-found: error

  release:
    name: Publish downloads (Releases → "latest")
    needs: [server, desktop, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect files and update manifests
        run: |
          mkdir out
          cp dl/Outhouse-Android-APK/Outhouse-Android.apk out/
          cp "$(find dl/Outhouse-Windows-installer -name '*.exe' | head -1)" out/Outhouse-Windows-Setup.exe
          SIG=$(find dl/Outhouse-Windows-installer -name '*.exe.sig' | head -1)
          # __BASE__ is swapped for https://<your server>/updates by deploy/fetch-updates.py.
          python3 - "$SIG" <<'PY'
          import json, sys, datetime, os
          version = os.environ["VERSION"]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          json.dump({"version": version, "url": "__BASE__/Outhouse-Android.apk", "pub_date": now},
                    open("out/android.json", "w"), indent=2)
          sig = sys.argv[1]
          if sig:
              json.dump({
                  "version": version,
                  "notes": "Outhouse " + version,
                  "pub_date": now,
                  "platforms": {"windows-x86_64": {
                      "signature": open(sig).read().strip(),
                      "url": "__BASE__/Outhouse-Windows-Setup.exe",
                  }},
              }, open("out/latest.json", "w"), indent=2)
          PY
          ls -la out
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/* --target "$GITHUB_SHA" --title "Outhouse $VERSION" \
            --notes "Built from $(echo $GITHUB_SHA | cut -c1-7). Your Outhouse server picks this up within 10 minutes and the apps update from there. To install by hand: Outhouse-Android.apk on Android, Outhouse-Windows-Setup.exe on Windows."
