<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Outhouse</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#121214">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&family=Montserrat:wght@800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sign in / sign up -->
<section id="auth" class="auth" hidden>
  <form id="auth-form" class="auth-card">
    <img src="logo.svg" alt="" class="auth-logo">
    <h1 class="wordmark">OUTHOUSE</h1>
    <p class="muted" id="auth-subtitle">Welcome back. Pull up a seat.</p>
    <label>Username<input name="username" autocomplete="username" required minlength="2" maxlength="32"></label>
    <label id="display-name-field" hidden>Display name<input name="display_name" maxlength="32" placeholder="What friends call you"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
    <p class="error" id="auth-error" role="alert"></p>
    <button type="submit" class="primary" id="auth-submit">Sign in</button>
    <button type="button" class="link" id="auth-toggle">New here? Create an account</button>
  </form>
</section>

<!-- Main app -->
<div id="app" class="app" hidden>
  <nav class="rail" aria-label="Servers">
    <button class="home" title="Outhouse" aria-label="Outhouse home"><img src="logo.svg" alt=""></button>
    <div class="rail-sep"></div>
    <div id="guild-list" class="guild-list"></div>
    <button class="rail-btn add" id="new-guild" title="Build a new outhouse" aria-label="Build a new outhouse">+</button>
    <button class="rail-btn join" id="join-guild" title="Join with an invite code" aria-label="Join with an invite code">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
    </button>
  </nav>

  <aside class="sidebar" aria-label="Channels">
    <header class="sidebar-head">
      <span id="guild-name">No outhouse yet</span>
      <button id="invite-btn" class="icon-btn" title="Invite people" aria-label="Invite people" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>
      </button>
    </header>
    <div class="channels">
      <div class="section-label">TEXT CHANNELS <button id="new-channel" class="icon-btn small" title="Create channel" aria-label="Create channel" hidden>+</button></div>
      <div id="text-channels"></div>
      <div class="section-label">VOICE</div>
      <div id="voice-channels"></div>
    </div>
    <div id="voice-panel" class="voice-panel" hidden></div>
    <div id="voice-audio" hidden></div>
    <footer class="user-panel">
      <div class="avatar" id="me-avatar"></div>
      <div class="me">
        <div id="me-name" class="me-name"></div>
        <div class="me-status">Vacant</div>
      </div>
      <button id="user-settings" class="icon-btn" title="User settings" aria-label="User settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="logout" class="icon-btn" title="Sign out" aria-label="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </footer>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <span class="hash">#</span>
      <span id="channel-name">—</span>
      <span class="divider"></span>
      <span class="topic muted">Leave it cleaner than you found it.</span>
      <span id="conn-status" class="conn" title="Connection"></span>
    </header>
    <div id="messages" class="messages" aria-live="polite"></div>
    <div class="composer-wrap" id="composer-wrap">
      <div id="reply-bar" class="reply-bar" hidden>
        <span>Replying to <strong id="reply-name"></strong></span>
        <button type="button" class="icon-btn small" id="reply-cancel" aria-label="Cancel reply">✕</button>
      </div>
      <div id="pending-files" class="pending-files" hidden></div>
      <form id="composer" class="composer">
        <button type="button" class="tool" id="attach-btn" title="Upload files" aria-label="Upload files">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden>
        <textarea id="composer-input" rows="1" autocomplete="off" placeholder="Write on the wall…" aria-label="Message" disabled></textarea>
        <button type="button" class="tool" id="raid-btn" title="Plan a raid" aria-label="Plan a raid">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h3"/></svg>
        </button>
        <button type="button" class="tool gif" id="gif-btn" title="GIFs" aria-label="GIFs">GIF</button>
        <button type="button" class="tool" id="emoji-btn" title="Emoji" aria-label="Emoji">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
        </button>
        <button type="submit" class="send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
      <div id="typing" class="typing" aria-live="polite"></div>
    </div>
  </main>

  <aside class="members" aria-label="Members">
    <div id="member-list"></div>
  </aside>
</div>

<div id="drop-overlay" class="drop-overlay" hidden><div>Drop files to upload</div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script src="app.js"></script>
<script src="features.js"></script>
<script src="chat-extras.js"></script>
<script src="dms.js"></script>
<script src="threads.js"></script>
<script src="raids.js"></script>
<script src="wow.js"></script>
<script src="voice-extras.js"></script>
<script src="notify.js"></script>
<script src="admin-extras.js"></script>
</body>
</html>
