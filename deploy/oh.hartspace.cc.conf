# Apache site for Outhouse at oh.hartspace.cc.
# Apache (192.168.1.32) owns ports 80/443; Outhouse runs on 192.168.1.122:8080.
#
# Install on the Apache server:
#   sudo cp oh.hartspace.cc.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#   sudo mkdir -p /var/www/letsencrypt
#   sudo a2ensite oh.hartspace.cc && sudo systemctl reload apache2
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d oh.hartspace.cc
#   sudo systemctl reload apache2
# The HTTPS part below switches itself on once the certificate exists, and
# certbot renews it automatically through the same folder.

<VirtualHost *:80>
    ServerName oh.hartspace.cc
    # Certificate checks are answered here; everything else goes to https.
    # Only /.well-known/acme-challenge/ is Apache's: other /.well-known files
    # (assetlinks.json for the Android app's invite links) come from Outhouse
    # over https via the ProxyPass below.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://oh.hartspace.cc/$1
</VirtualHost>

<IfFile /etc/letsencrypt/live/oh.hartspace.cc/fullchain.pem>
<VirtualHost *:443>
    ServerName oh.hartspace.cc
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/oh.hartspace.cc/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/oh.hartspace.cc/privkey.pem
    <IfFile /etc/letsencrypt/options-ssl-apache.conf>
        Include /etc/letsencrypt/options-ssl-apache.conf
    </IfFile>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    # Live chat (/api/gateway) and voice signalling (/rtc) are WebSockets.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://192.168.1.122:8080/$1 [P,L]
    ProxyPass        / http://192.168.1.122:8080/
    ProxyPassReverse / http://192.168.1.122:8080/
    # Uploads (attachments, soundboard clips) up to 100 MB.
    LimitRequestBody 104857600
</VirtualHost>
</IfFile>
