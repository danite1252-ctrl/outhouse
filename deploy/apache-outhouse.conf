# Apache site for Outhouse when Apache (192.168.1.32) owns ports 80/443 and
# Outhouse runs on 192.168.1.122. Copy to /etc/apache2/sites-available/outhouse.conf,
# change chat.example.com to your subdomain, then:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#   sudo a2ensite outhouse && sudo systemctl reload apache2
#   sudo certbot --apache -d chat.example.com     (adds the HTTPS lines below)

<VirtualHost *:80>
    ServerName chat.example.com
    Redirect permanent / https://chat.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName chat.example.com
    # --- certbot fills in SSLEngine / SSLCertificateFile / SSLCertificateKeyFile ---

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    # Only Apache says who the visitor is: drop whatever the visitor sent, so
    # Outhouse's sign-in limits see the real address (Apache adds it back).
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Real-IP early
    # Outhouse sends CSP, X-Frame-Options and friends itself; HSTS here as
    # well so it's there even if the app is down (Apache's error pages).
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always unset X-Powered-By
    # No forward proxying, no TRACE (see apache-hardening.conf for the rest).
    TraceEnable Off
    # Live chat (/api/gateway) and voice signalling (/rtc) are WebSockets.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://192.168.1.122:8080/$1 [P,L]
    ProxyPass        / http://192.168.1.122:8080/
    ProxyPassReverse / http://192.168.1.122:8080/
    # Allow uploads (attachments, soundboard clips) up to 100 MB.
    LimitRequestBody 104857600
</VirtualHost>
