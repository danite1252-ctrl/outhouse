# Server-wide hardening for the Apache that fronts hartspace.cc and
# oh.hartspace.cc (192.168.1.32). It only sets things every site should
# have; nothing here assumes anything about hartspace.cc's own app.
#
# Install (Ubuntu/Debian). The "zz-" name matters: Apache reads
# conf-enabled/*.conf in name order and the last setting wins, so this must
# load after Ubuntu's security.conf (which says ServerTokens OS).
#   sudo cp apache-hardening.conf /etc/apache2/conf-available/zz-hardening.conf
#   sudo a2enmod headers ssl reqtimeout
#   sudo a2enconf zz-hardening
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# Then check from outside with deploy/security-scan.sh (or .ps1).
# Everything is commented: drop any line that a site on this Apache needs
# to be different (each site's own <VirtualHost> settings can override).

# ---- Say less about the server -------------------------------------------
# "Server: Apache" instead of "Apache/2.4.58 (Ubuntu)", and no version on
# error pages.
ServerTokens Prod
ServerSignature Off
# TRACE echoes requests back (cross-site tracing). Nobody needs it.
TraceEnable Off
# No ETags built from inode numbers (old information leak).
FileETag MTime Size

# ---- No directory listings, no dotfiles, no backups ----------------------
<Directory /var/www/>
    # Never list folder contents (sites that really want a listing can turn
    # Indexes back on for that one folder).
    Options -Indexes
</Directory>
# .git, .env, .htpasswd and other dotfiles (but not /.well-known/, which
# certbot and Android App Links need).
<LocationMatch "/\.(?!well-known/)">
    Require all denied
</LocationMatch>
# Editor and backup leftovers.
<FilesMatch "(?i)(\.(bak|backup|old|orig|save|swp|sql|sqlite|sqlite3|dump|env|pem|key)|~)$">
    Require all denied
</FilesMatch>

# ---- mod_status / mod_info: this machine only ------------------------------
<IfModule mod_status.c>
    ExtendedStatus Off
    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>
</IfModule>
<IfModule mod_info.c>
    <Location /server-info>
        SetHandler server-info
        Require local
    </Location>
</IfModule>

# ---- Slow-request (slowloris) and size limits ------------------------------
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>
Timeout 60
LimitRequestFieldSize 16384
LimitRequestFields 100
# Never act as an open forward proxy.
<IfModule mod_proxy.c>
    ProxyRequests Off
</IfModule>

# ---- TLS: modern protocols and ciphers (Mozilla "intermediate") -----------
<IfModule mod_ssl.c>
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    SSLCompression          off
    # (No OCSP stapling: Let's Encrypt certificates no longer have OCSP.)
</IfModule>
# certbot's /etc/letsencrypt/options-ssl-apache.conf (included by the vhosts)
# sets the same kind of protocols/ciphers; if a vhost includes it, its
# values apply to that vhost.

# ---- Response headers for every site ---------------------------------------
<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"
    # Stops other sites framing yours (clickjacking). If hartspace.cc ever
    # needs to be framed by itself, use SAMEORIGIN; apps that send their own
    # value (Outhouse does) keep it.
    Header always setifempty X-Frame-Options "SAMEORIGIN"
    # HSTS on HTTPS responses only. Start without includeSubDomains; once
    # every *.hartspace.cc name has working HTTPS, change it to
    #   "max-age=31536000; includeSubDomains"
    # (and only then think about "preload").
    Header always setifempty Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
</IfModule>

