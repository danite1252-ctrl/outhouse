# Outhouse on your own Linux server: website, API, voice and HTTPS.
# Don't run this by hand the first time; use ./setup.sh, which writes the
# .env and livekit.yaml this file needs.
#   Update after copying new code:  docker compose up -d --build
#   Logs:                           docker compose logs -f server
name: outhouse

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: outhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: outhouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://outhouse:${POSTGRES_PASSWORD}@db:5432/outhouse
      BIND_ADDR: 0.0.0.0:8080
      WEB_DIR: /app/web
      UPLOAD_DIR: /data/uploads
      RUST_LOG: outhouse_server=info,tower_http=warn
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Browsers reach voice through Caddy on the same address as the site.
      LIVEKIT_URL: wss://${DOMAIN}
      # Outhouse itself talks to LiveKit's API (server mute, disconnect) on this machine.
      LIVEKIT_API_URL: http://host.docker.internal:7880
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Who can make accounts: open (default), invite or closed. See README "Security checks".
      REGISTRATION: ${REGISTRATION:-open}
      # Proxies whose X-Forwarded-For is believed (blank = this machine, LAN and Docker networks).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMITS: ${RATE_LIMITS:-on}
      # WoW tools (all optional; see README "WoW tools").
      PUBLIC_URL: https://${DOMAIN}
      BNET_CLIENT_ID: ${BNET_CLIENT_ID:-}
      BNET_CLIENT_SECRET: ${BNET_CLIENT_SECRET:-}
      BNET_REGION: ${BNET_REGION:-us}
      BNET_PROFILE_NAMESPACES: ${BNET_PROFILE_NAMESPACES:-}
      BNET_NAMESPACE_GAMES: ${BNET_NAMESPACE_GAMES:-}
      BNET_FOREVER_PROFILE_NAMESPACE: ${BNET_FOREVER_PROFILE_NAMESPACE:-}
      BNET_FOREVER_STATIC_NAMESPACE: ${BNET_FOREVER_STATIC_NAMESPACE:-}
      # "View on Armory" links and Armory refreshes (see README "WoW tools").
      ARMORY_URL_TEMPLATE: ${ARMORY_URL_TEMPLATE:-}
      ARMORY_COMMUNITY_URL_TEMPLATE: ${ARMORY_COMMUNITY_URL_TEMPLATE:-}
      ARMORY_URL_TEMPLATE_TBC: ${ARMORY_URL_TEMPLATE_TBC:-}
      ARMORY_URL_TEMPLATE_ERA: ${ARMORY_URL_TEMPLATE_ERA:-}
      ARMORY_REFRESH_HOURS: ${ARMORY_REFRESH_HOURS:-}
      WOWHEAD_URL: ${WOWHEAD_URL:-}
      WOWHEAD_BRANCH: ${WOWHEAD_BRANCH:-}
      WOWHEAD_TOOLTIP_URL: ${WOWHEAD_TOOLTIP_URL:-}
      WOWHEAD_DATA_ENV: ${WOWHEAD_DATA_ENV:-}
      WOWHEAD_BRANCH_FOREVER: ${WOWHEAD_BRANCH_FOREVER:-}
      WOWHEAD_BRANCH_TBC: ${WOWHEAD_BRANCH_TBC:-}
      WOWHEAD_DATA_ENV_TBC: ${WOWHEAD_DATA_ENV_TBC:-}
      WOWHEAD_MIN_GAP_MS: ${WOWHEAD_MIN_GAP_MS:-}
      LINK_PREVIEWS_OFFLINE: ${LINK_PREVIEWS_OFFLINE:-}
      # Audit log entries are kept this many days.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      # Web Push: who push services can contact (defaults to the site's address).
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Android App Links for invite links: the app's signing certificate SHA-256
      # (blank = the Outhouse release key; "off" = no App Links).
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      # Safety reports (see README "Safety & reports"): who the site owner is
      # (usernames or IDs, comma-separated; blank = the first account made), and
      # child-safety reports also alert the same ntfy / webhook as healthcheck.sh.
      SITE_OWNER: ${SITE_OWNER:-}
      ALERT_NTFY_URL: ${ALERT_NTFY_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      REPORTS_PER_HOUR: ${REPORTS_PER_HOUR:-}
      # backup.sh leaves its result here; Outhouse settings → Server status shows it.
      BACKUP_STATUS_FILE: /app/status/backup.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
      # App updates fetched from GitHub by fetch-updates.py, served at /updates/.
      - ./updates:/app/web/updates:ro
      # Backup and health status written by backup.sh (read-only in here).
      - ./status:/app/status:ro

  # Voice. Host networking lets LiveKit offer both the server's home-network
  # address (for people at home) and your public address (for everyone else).
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Front door. setup.sh picks one of these two via COMPOSE_PROFILES in .env.
  # "https": this server faces the internet itself and gets a free
  # Let's Encrypt certificate (ports 80 and 443 must reach it).
  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # "behind-proxy": another web server (e.g. Apache) handles HTTPS and passes
  # traffic to plain HTTP on port 8080 here.
  caddy-proxied:
    profiles: ["behind-proxy"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile.behind-proxy:/etc/caddy/Caddyfile:ro
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
